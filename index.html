<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1220"><title>SECURITY CONTROL – Testbetrieb</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%0A%20%20%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22112%22%20fill%3D%22%230b1220%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M256%2072%20400%20128v112c0%2092-60%20168-144%20200-84-32-144-108-144-200V128z%22%20fill%3D%22%2314213d%22%20stroke%3D%22%233b82f6%22%20stroke-width%3D%2218%22%20stroke-linejoin%3D%22round%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%22256%22%20cy%3D%22250%22%20r%3D%2278%22%20fill%3D%22%23dc2626%22%2F%3E%0A%20%20%3Ctext%20x%3D%22256%22%20y%3D%22274%22%20font-family%3D%22Arial%2C%20Helvetica%2C%20sans-serif%22%20font-size%3D%2264%22%20font-weight%3D%22700%22%20fill%3D%22%23fff%22%20text-anchor%3D%22middle%22%3ESOS%3C%2Ftext%3E%0A%3C%2Fsvg%3E%0A">
<style>/* SECURITY CONTROL – Design-System
   Dunkles Navy/Anthrazit, helle Schrift, zurückhaltendes Blau, Rot ausschließlich für SOS und Warnungen.
   Mobile-first; große Bedienelemente; sichtbare Fokuszustände. */
:root {
  --bg: #0b1220;
  --surface: #111a2e;
  --surface-2: #17223a;
  --surface-3: #1e2b47;
  --border: #26345a;
  --text: #e8eef9;
  --muted: #94a3c0;
  --blue: #3b82f6;
  --blue-soft: #1d3a6e;
  --green: #22c55e;
  --amber: #f59e0b;
  --red: #dc2626;
  --red-bright: #ef4444;
  --radius: 14px;
  --shadow: 0 8px 24px rgba(0, 0, 0, .35);
  --tap: 48px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: #8db8ff; }
h1 { font-size: 1.5rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
h2 { font-size: 1.1rem; margin: 0 0 .75rem; display: flex; align-items: center; gap: .4rem; }
h3 { font-size: 1rem; margin: 1.25rem 0 .5rem; }
p { margin: .35rem 0; }
code { background: var(--surface-3); padding: .1rem .35rem; border-radius: 6px; font-size: .85em; }
.break { word-break: break-all; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.center { text-align: center; }
.strong { font-weight: 700; }
.warn { color: var(--amber); }
.prewrap { white-space: pre-wrap; }
.mt { margin-top: 1rem; }
.icon { width: 1.25em; height: 1.25em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
.skip-link { position: absolute; left: -999px; top: 0; background: var(--blue); color: #fff; padding: .5rem 1rem; z-index: 100; }
.skip-link:focus { left: 0; }
.loading { padding: 3rem; text-align: center; color: var(--muted); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-height: var(--tap); padding: .6rem 1.1rem;
  border-radius: 12px; border: 1px solid transparent; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; color: var(--text);
  background: var(--surface-3); transition: background .15s, transform .05s; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: #2f6fd8; }
.btn-secondary { background: var(--surface-3); border-color: var(--border); }
.btn-secondary:hover { background: #24345a; }
.btn-light { background: #e8eef9; color: #0b1220; }
.btn-ghost { background: transparent; border-color: var(--border); }
.btn-danger { background: var(--red); color: #fff; }
.btn-outline-danger { background: transparent; color: #fca5a5; border: 2px solid rgba(239, 68, 68, .6); }
.btn-lg { min-height: 56px; font-size: 1.05rem; }
.btn-sm { min-height: 36px; padding: .3rem .7rem; font-size: .875rem; }
.btn-block { width: 100%; }
.btn-icon { background: transparent; border: 0; color: var(--muted); min-width: var(--tap); min-height: var(--tap); cursor: pointer; border-radius: 10px; }
.btn-icon:hover { color: var(--text); background: var(--surface-2); }
.btn-row { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .75rem; }

/* Formulare */
input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  padding: .6rem .75rem; min-height: var(--tap); width: 100%; }
textarea { min-height: 96px; }
input[type=checkbox] { width: 22px; height: 22px; min-height: 0; accent-color: var(--blue); }
.field { display: flex; flex-direction: column; gap: .3rem; margin-bottom: .75rem; }
.field > span { font-weight: 600; font-size: .9rem; }
.check { display: flex; align-items: center; gap: .5rem; min-height: var(--tap); }
.form-grid { display: grid; gap: .25rem 1rem; grid-template-columns: 1fr; }
.inline-form { display: flex; gap: .5rem; align-items: stretch; }
.inline-form > * { flex: 1; }
.inline-form > button { flex: none; }
.inline-form.wrap { flex-wrap: wrap; }
.inline-form.wrap > input, .inline-form.wrap > select { min-width: 140px; }
fieldset.participants { border: 1px solid var(--border); border-radius: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }

/* Öffentliche Seiten */
.public { max-width: 980px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
.brand-lg { display: flex; align-items: center; gap: .75rem; margin: 1rem 0 1.5rem; }
.brand-lg strong { display: block; font-size: 1.35rem; letter-spacing: .06em; }
.brand-mark { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--red); color: #fff; }
.auth-wrap { display: grid; gap: 1rem; grid-template-columns: 1fr; max-width: 980px; margin: 0 auto; }
.auth-wrap.wide { max-width: 820px; }
.auth { max-width: 460px; width: 100%; }
.auth-links { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; font-size: .9rem; }
.demo-flag { background: #3b2f0b; color: #fde68a; border: 1px solid #a16207; border-radius: 10px; padding: .6rem .9rem; margin-bottom: 1rem; font-weight: 600; }
.demo-users { display: grid; gap: .5rem; }
.demo-user { text-align: left; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; color: var(--text); padding: .7rem .9rem;
  cursor: pointer; display: flex; flex-direction: column; min-height: var(--tap); font: inherit; }
.demo-user:hover { border-color: var(--blue); }
.demo-user span { color: var(--muted); font-size: .85rem; }

/* App-Rahmen */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: .75rem; padding: .5rem .75rem;
  background: rgba(11, 18, 32, .92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: .5rem; color: var(--text); text-decoration: none; font-weight: 800; letter-spacing: .06em; }
.brand .brand-mark { width: 32px; height: 32px; }
.brand-text { display: none; }
.org-select { width: auto; max-width: 46vw; min-height: 40px; padding: .3rem .5rem; background: var(--surface); }
.org-name { font-weight: 600; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
.demo-pill { background: #a16207; color: #fff; font-size: .7rem; font-weight: 800; padding: .2rem .5rem; border-radius: 999px; text-decoration: none; }
.user { margin-left: auto; display: none; flex-direction: column; text-align: right; font-size: .85rem; line-height: 1.2; }
.user small { color: var(--muted); }
.layout { display: block; }
main { padding: 1rem .9rem 6rem; max-width: 1280px; margin: 0 auto; outline: none; }
.sidenav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; display: flex; overflow-x: auto; background: var(--surface);
  border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
.sidenav a { flex: 1 0 72px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: .45rem .25rem; font-size: .7rem;
  color: var(--muted); text-decoration: none; min-height: 56px; justify-content: center; }
.sidenav a.active { color: #fff; background: var(--blue-soft); }
.page-title { margin: .25rem 0 1rem; }
.offline-banner { background: #3b0d0d; color: #fecaca; padding: .6rem .9rem; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.offline-banner[hidden] { display: none; }
.alarm-banner { background: var(--red); color: #fff; padding: .6rem .9rem; display: flex; flex-wrap: wrap; gap: .6rem; align-items: center;
  animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { background: #b91c1c; } }
@media (prefers-reduced-motion: reduce) { .alarm-banner { animation: none; } }
.fallback-links { display: inline-flex; flex-wrap: wrap; gap: .4rem; }

/* Karten / Raster */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin-bottom: 1rem; }
.stack { display: flex; flex-direction: column; }
.grid-2, .grid-3 { display: grid; gap: 1rem; grid-template-columns: 1fr; }
.grid-2 > .card, .grid-3 > .card { margin-bottom: 0; }
.grid-2 { margin-bottom: 1rem; }
.list { display: flex; flex-direction: column; gap: .5rem; }
.list-item { display: flex; align-items: center; gap: .75rem; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
  padding: .7rem .8rem; color: var(--text); text-decoration: none; }
a.list-item:hover { border-color: var(--blue); }
.grow { flex: 1; min-width: 0; }
.chev { color: var(--muted); font-size: 1.5rem; }
.status-dot { width: 14px; height: 14px; border-radius: 50%; flex: none; display: inline-block; }
.sos-item.status-open { border-color: rgba(239, 68, 68, .7); background: #2a1215; }
.badge { display: inline-block; padding: .1rem .5rem; border-radius: 999px; font-size: .75rem; font-weight: 700; background: var(--surface-3); color: var(--text); margin-left: .25rem; }
.badge-blue { background: var(--blue-soft); color: #bfdbfe; }
.badge-muted { background: #2a3350; color: var(--muted); }
.badge-ok, .badge-on_duty, .badge-delivered, .badge-sent, .badge-closed { background: #12351f; color: #86efac; }
.badge-break, .badge-planned, .badge-in_review, .badge-submitted { background: #1d3a6e; color: #bfdbfe; }
.badge-stale, .badge-absent, .badge-skipped { background: #3b2f0b; color: #fde68a; }
.badge-failed { background: #3b0d0d; color: #fecaca; }
.badge-simulated { background: #2e1f4d; color: #d8b4fe; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: #475569; margin-right: .35rem; }
.dot.on_duty { background: var(--green); } .dot.break { background: var(--amber); } .dot.stale { background: var(--amber); outline: 2px dashed #fde68a; }
.duty-status { display: flex; align-items: center; flex-wrap: wrap; gap: .25rem; font-size: 1.05rem; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: .35rem 1rem; margin: .75rem 0 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.status-big { border-left: 6px solid; padding: .5rem .75rem; font-size: 1.2rem; font-weight: 800; background: var(--surface-2); border-radius: 8px; }
.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-bottom: .75rem; }
.timeline { list-style: none; padding: 0; margin: 0; border-left: 2px solid var(--border); }
.timeline li { padding: .3rem 0 .3rem 1rem; position: relative; }
.timeline li::before { content: ""; position: absolute; left: -6px; top: .75rem; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); }
.timeline time, .feed time { color: var(--muted); font-variant-numeric: tabular-nums; }
.feed { list-style: none; margin: 0; padding: 0; } .feed li { padding: .3rem 0; border-bottom: 1px solid var(--border); }
.member-list, .contact-list { list-style: none; margin: 0 0 .75rem; padding: 0; }
.member-list li, .contact-list li { display: flex; align-items: center; flex-wrap: wrap; gap: .25rem; padding: .4rem 0; border-bottom: 1px solid var(--border); }
.contact-list a { display: inline-flex; align-items: center; gap: .3rem; min-height: 40px; }
.row-actions { margin-left: auto; display: flex; gap: .25rem; }
.legend { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: .5rem; font-size: .85rem; }
.legend > span { display: inline-flex; align-items: center; gap: .35rem; }

/* Tabellen (auf Mobil als Karten) */
.table { width: 100%; border-collapse: collapse; font-size: .92rem; }
.table th, .table td { text-align: left; padding: .5rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
.table th { color: var(--muted); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
.row-warn td { background: rgba(245, 158, 11, .08); }
@media (max-width: 720px) {
  .table.responsive thead { display: none; }
  .table.responsive tr { display: block; border: 1px solid var(--border); border-radius: 12px; margin-bottom: .6rem; padding: .4rem .6rem; background: var(--surface-2); }
  .table.responsive td { display: flex; justify-content: space-between; gap: 1rem; border: 0; padding: .3rem 0; }
  .table.responsive td[data-label]::before { content: attr(data-label); color: var(--muted); font-size: .8rem; }
}

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: .75rem; margin-bottom: 1rem; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .9rem 1rem; display: flex; flex-direction: column; }
.kpi-value { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi-label { color: var(--muted); font-size: .85rem; }
.kpi-danger { border-color: var(--red-bright); background: #2a1215; } .kpi-danger .kpi-value { color: #fca5a5; }
.sos-overview { border-width: 2px; }
.sos-overview.has-open { border-color: var(--red-bright); box-shadow: 0 0 0 4px rgba(239, 68, 68, .15); }
.sos-overview h2 .icon { color: var(--red-bright); }

/* SOS */
.sos-card { display: flex; flex-direction: column; align-items: stretch; }
.sos-wrap { display: grid; place-items: center; padding: 1rem 0; }
.sos-button { position: relative; width: min(72vw, 260px); aspect-ratio: 1; border-radius: 50%; border: 0; cursor: pointer; color: #fff;
  background: radial-gradient(circle at 35% 30%, #f87171, var(--red) 55%, #991b1b); box-shadow: 0 0 0 10px rgba(220, 38, 38, .18), 0 18px 40px rgba(0, 0, 0, .5);
  display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; touch-action: none;
  -webkit-touch-callout: none; transition: transform .15s; }
.sos-button.holding { transform: scale(.96); box-shadow: 0 0 0 18px rgba(220, 38, 38, .3), 0 18px 40px rgba(0, 0, 0, .5); }
.sos-label { font-size: clamp(2.6rem, 12vw, 4rem); font-weight: 900; letter-spacing: .08em; }
.sos-sub { font-size: .95rem; opacity: .9; }
.ring { position: absolute; inset: -14px; width: calc(100% + 28px); height: calc(100% + 28px); transform: rotate(-90deg); pointer-events: none; }
.ring-progress { fill: none; stroke: #fff; stroke-width: 3.5; stroke-linecap: round; }
.sos-options { margin-top: 1rem; } .sos-options summary { cursor: pointer; min-height: var(--tap); display: flex; align-items: center; color: var(--muted); }
.sos-state { text-align: center; padding: 1rem; border-radius: var(--radius); }
.sos-state > .icon { width: 48px; height: 48px; }
.sos-state.sending { background: var(--surface-2); }
.sos-state.failed { background: #3b0d0d; border: 2px solid var(--red-bright); }
.sos-state.saved { background: #10291b; border: 2px solid var(--green); }
.sos-state .ref { font-size: 1.3rem; letter-spacing: .1em; }
.sos-state .fallback-links { justify-content: center; margin: .5rem 0; }
.spinner { width: 48px; height: 48px; border-radius: 50%; border: 5px solid var(--border); border-top-color: #fff; margin: 0 auto .5rem; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.dialog { background: var(--surface); color: var(--text); border: 2px solid var(--red-bright); border-radius: var(--radius); padding: 1.25rem; max-width: 420px; width: 92vw; }
.dialog::backdrop { background: rgba(0, 0, 0, .7); }

/* Karte */
.map-host { min-height: 320px; }
.map-host.small { min-height: 260px; }
.map svg { width: 100%; height: auto; background: #0e1830; border-radius: 12px; border: 1px solid var(--border); }
.map .grid { stroke: #1b2846; stroke-width: 1; }
.map .area { fill: rgba(59, 130, 246, .12); stroke: rgba(59, 130, 246, .6); stroke-width: 2; stroke-dasharray: 6 4; }
.map .area-label { fill: #93c5fd; font-size: 13px; }
.map .marker { cursor: pointer; } .map .marker circle { stroke: #fff; stroke-width: 3; }
.map .marker-open circle { animation: blink 1s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .5; } }
.map .marker-label { fill: #fff; font-size: 12px; font-weight: 700; }
.map-marker { border: 2px solid #fff; color: #fff; border-radius: 999px; padding: .2rem .5rem; font-weight: 800; cursor: pointer; }
.map-note { margin-top: .4rem; }

/* Toasts */
#toasts { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: 80px; display: flex; flex-direction: column; gap: .5rem; width: min(92vw, 480px); }
.toast { padding: .75rem 1rem; border-radius: 12px; box-shadow: var(--shadow); background: var(--surface-3); border: 1px solid var(--border); }
.toast-ok { border-color: var(--green); } .toast-error { border-color: var(--red-bright); background: #3b0d0d; }

details.incident summary { cursor: pointer; list-style: none; } details.incident summary::-webkit-details-marker { display: none; }

/* Desktop */
@media (min-width: 760px) {
  .brand-text { display: inline; }
  .user { display: flex; }
  .form-grid { grid-template-columns: repeat(2, 1fr); }
  .kpis { grid-template-columns: repeat(4, 1fr); }
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
  .auth-wrap { grid-template-columns: minmax(0, 460px) minmax(0, 1fr); align-items: start; }
  .auth-wrap.wide { grid-template-columns: 1fr; }
}
@media (min-width: 1024px) {
  .layout { display: grid; grid-template-columns: 220px 1fr; }
  .sidenav { position: sticky; top: 57px; height: calc(100vh - 57px); flex-direction: column; border-top: 0; border-right: 1px solid var(--border); padding: .75rem .5rem; gap: .25rem; }
  .sidenav a { flex: none; flex-direction: row; gap: .6rem; font-size: .95rem; padding: .6rem .8rem; border-radius: 10px; justify-content: flex-start; min-height: 44px; }
  main { padding: 1.5rem 1.5rem 3rem; }
  .grid-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  #toasts { bottom: 24px; }
}

/* Testbetrieb: SOS-Nummern, Telefonaktionen, Zugangsdaten */
.pilot-flag { background: #0f2a4a; color: #bfdbfe; border-color: #3b82f6; }
.hint-card { display: flex; gap: .75rem; align-items: center; color: var(--text); text-decoration: none; border-color: var(--amber); }
.hint-card .icon { color: var(--amber); width: 28px; height: 28px; }
.sos-numbers { border-color: var(--blue); }
.num-status { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: -.25rem 0 1rem; }
.phone-box { display: flex; flex-direction: column; gap: .6rem; margin: .75rem 0; text-align: left; }
.phone-row { display: flex; flex-direction: column; gap: .4rem; background: rgba(0,0,0,.25); border-radius: 12px; padding: .7rem; }
.phone-row .btn { width: 100%; }
.credentials { background: var(--surface-2); border: 1px solid var(--green); border-radius: 12px; padding: .75rem; margin-top: .75rem; }
.credentials pre { white-space: pre-wrap; margin: .4rem 0 0; font-size: .95rem; user-select: all; }
a.user { color: inherit; text-decoration: none; }
.stack-sm { display: flex; flex-direction: column; gap: .5rem; }
.sms-preview summary { cursor: pointer; color: var(--muted); font-size: .85rem; min-height: 36px; display: flex; align-items: center; }
.sms-preview pre { white-space: pre-wrap; font-size: .85rem; background: var(--surface-2); padding: .6rem; border-radius: 8px; user-select: all; }

/* Dienstplan */
.seg { display: flex; flex-wrap: wrap; gap: .25rem; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: .25rem; margin-bottom: 1rem; }
.seg a { flex: 1 0 auto; text-align: center; padding: .55rem .8rem; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: .9rem; min-height: 40px; }
.seg a.active { background: var(--blue); color: #fff; }
.next-shift { border: 2px solid var(--blue); background: linear-gradient(160deg, #13254a, var(--surface)); }
.next-shift h2 { font-size: 1.35rem; margin: .1rem 0; }
.next-time { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.countdown { display: inline-block; margin: .35rem 0; padding: .2rem .6rem; border-radius: 999px; background: var(--blue-soft); color: #bfdbfe; font-weight: 700; font-size: .85rem; }
.note { background: rgba(245, 158, 11, .1); border-left: 3px solid var(--amber); padding: .4rem .6rem; border-radius: 6px; }
.kpis-3 { grid-template-columns: repeat(3, 1fr); }
.kpis-3 .kpi-value { font-size: 1.5rem; }
.mb { margin-bottom: 1rem; }
.section-title { margin: 1rem 0 .5rem; }
.day-group { margin-bottom: .9rem; }
.day-head { font-weight: 700; color: var(--muted); font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; margin: .4rem 0; }
.shift-item { align-items: stretch; }
.shift-item.is-open { border-left: 4px solid var(--amber); }
.shift-item.is-confirmed { border-left: 4px solid var(--green); }
.shift-time { display: flex; flex-direction: column; justify-content: center; min-width: 58px; font-variant-numeric: tabular-nums; }
.shift-time strong { font-size: 1.05rem; } .shift-time span { color: var(--muted); font-size: .85rem; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: .5rem; text-transform: capitalize; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: .3rem; }
.cal-wd { text-align: center; color: var(--muted); font-size: .75rem; font-weight: 700; }
.cal-cell { aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
.cal-cell.empty { background: transparent; border: 0; cursor: default; }
.cal-cell.today { border-color: var(--blue); }
.cal-cell.sel { background: var(--blue); color: #fff; }
.cal-cell.has-own { background: #12351f; border-color: var(--green); }
.cal-cell.has-own.sel { background: var(--blue); }
.cal-dot { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); min-width: 6px; height: 6px; border-radius: 3px; background: var(--green); font-style: normal; font-size: .6rem; line-height: 6px; color: #fff; }
.cal-cell.has-any .cal-dot { background: var(--blue); }
.swap-item { align-items: center; }
.btn-col { display: flex; flex-direction: column; gap: .35rem; }
.back-link { display: inline-block; margin-bottom: .5rem; color: var(--muted); text-decoration: none; min-height: 32px; }
.kv-lg { grid-template-columns: 110px 1fr; } .kv-lg dd { font-weight: 600; }
.action-col { display: flex; flex-direction: column; gap: .5rem; }
.swap-offer { display: flex; flex-direction: column; gap: .4rem; }
details.past summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; font-weight: 600; }

/* Mehr-Menü, Badges */
.tile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .75rem; }
.tile { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .5rem; min-height: 104px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); text-decoration: none; font-weight: 600; }
.tile .icon { width: 28px; height: 28px; color: #93c5fd; }
.sidenav a { position: relative; }
.nav-badge { position: absolute; top: 4px; right: calc(50% - 22px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: .7rem; line-height: 18px; text-align: center; font-style: normal; }
.tile .nav-badge { top: 10px; right: 12px; }
@media (min-width: 1024px) { .sidenav a .nav-badge { position: static; margin-left: auto; } }

/* Einsätze */
.offer { border-left: 4px solid var(--blue); }
.offer.is-closed { opacity: .7; border-left-color: var(--muted); }
.offer-head { display: flex; justify-content: space-between; gap: 1rem; }
.offer h3 { margin: .1rem 0; font-size: 1.1rem; }
.small-time { font-size: 1.15rem; }
.slots { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 64px; background: var(--surface-2); border-radius: 12px; padding: .4rem; }
.slots strong { font-size: 1.5rem; color: #86efac; line-height: 1; } .slots span { font-size: .7rem; color: var(--muted); }
.applicants { margin-top: .75rem; border-top: 1px solid var(--border); padding-top: .5rem; }
.avail-hint.ok { color: #86efac; }

/* Verfügbarkeit */
.cal-cell.av-available { background: #12351f; border-color: var(--green); }
.cal-cell.av-unavailable { background: #3b0d0d; border-color: var(--red-bright); }
.cal-cell.av .cal-dot { background: var(--blue); }
.av-actions { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-top: .75rem; }
.av-actions .btn-ghost { grid-column: 1 / -1; }

/* Mitteilungen */
.msg-item.unread { border-color: var(--blue); background: #13254a; }
.msg-item.unread strong { color: #fff; }
.unread-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--blue); flex: none; }
.compose summary { cursor: pointer; font-weight: 700; min-height: 40px; display: flex; align-items: center; color: #93c5fd; }
.msg-body { font-size: 1.02rem; line-height: 1.6; }

/* Zeiterfassung */
.clock { text-align: center; border: 2px solid var(--border); }
.clock.clock-on_duty { border-color: var(--green); background: linear-gradient(160deg, #10291b, var(--surface)); }
.clock.clock-break { border-color: var(--amber); background: linear-gradient(160deg, #3b2f0b, var(--surface)); }
.clock-state { font-weight: 700; font-size: 1.1rem; margin-top: .25rem; }
.clock-time { font-size: 3rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; margin: .25rem 0; }
.clock-btns { justify-content: center; }
.clock-btns .btn { min-width: 150px; }
.kpi-warn { border-color: var(--amber); } .kpi-warn .kpi-value { color: #fde68a; }
tr.clickable { cursor: pointer; } tr.clickable:hover td { background: var(--surface-2); }
.dialog-neutral { border-color: var(--blue); }
.home-news { display: flex; flex-direction: column; gap: .5rem; }
.home-news a { display: flex; align-items: center; gap: .6rem; color: var(--text); text-decoration: none; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: .6rem .8rem; min-height: 48px; }
.home-news a .icon { color: #93c5fd; }
.home-news b { margin-left: auto; background: var(--red); color: #fff; border-radius: 10px; padding: 0 .5rem; font-size: .8rem; }

.preview-tools{position:fixed;right:10px;bottom:76px;z-index:60;background:#1e2b47;border:1px solid #3b82f6;border-radius:12px;max-width:320px;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.preview-tools summary{cursor:pointer;padding:.5rem .9rem;font-weight:700;color:#bfdbfe;list-style:none}
.preview-tools>div{padding:0 .9rem .9rem;display:flex;flex-direction:column;gap:.5rem}
.preview-tools p{color:#94a3c0;font-size:.8rem;margin:0}
.preview-tools .chk{display:flex;align-items:center;gap:.4rem}
.preview-tools button{min-height:40px;border-radius:10px;border:1px solid #26345a;background:#111a2e;color:#e8eef9;font:inherit;cursor:pointer}
@media(min-width:1024px){.preview-tools{bottom:16px}}</style></head>
